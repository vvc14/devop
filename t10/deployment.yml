apiVersion: apps/v1
kind: Deployment
metadata:
  name: lab-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: lab-app
  template:
    metadata:
      labels:
        app: lab-app
    spec:
      containers:
        - name: web
          image: lab-app:v1
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
          